<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FilaMan - Bambu Usage</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Adopt the theme the user picked in FilaMan itself, before first paint.
    (function () {
      var t = localStorage.getItem('theme') || 'brand';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* Token names and values mirror FilaMan so the page belongs to the app.
       Everything is inline because the plugin ZIP rejects .css and .js files. */
    :root {
      --font-sans: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      --font-serif: "Fraunces", "Georgia", serif;
      --radius-md: 14px;
      --radius-sm: 12px;
      /* The colour of a filament, shown on the card and in the picker. One
         number, because it is the same thing in both places. */
      --swatch-width: 12px;
      /* Wide enough that the plate is recognisable, and tall enough to reach
         the bottom of the first filament block on a running print. */
      --preview-size: 220px;
      --shadow-sm: 0 6px 18px rgba(0,0,0,0.08);
      --transition: 220ms ease;
    }

    html[data-theme="brand"] {
      --bg-elevated: #13261d; --bg-soft: #183225;
      --text: #e9f3ec; --text-muted: #b5c7bd;
      --accent: #4ee3a2; --accent-3: #f7c86a;
      --border: rgba(255,255,255,0.08);
      --error-text: #fca5a5; --success-text: #86efac;
      --gradient-hero: radial-gradient(circle at 20% 20%, rgba(78,227,162,0.25), transparent 60%),
        radial-gradient(circle at 80% 0%, rgba(108,198,255,0.18), transparent 55%),
        linear-gradient(140deg, #0c1612 0%, #12251b 45%, #0b1410 100%);
    }
    html[data-theme="light"] {
      --bg-elevated: #ffffff; --bg-soft: #f1ece3;
      --text: #1a231e; --text-muted: #53645a;
      --accent: #1c9b6b; --accent-3: #d38e2c;
      --border: rgba(26,35,30,0.12);
      --error-text: #b91c1c; --success-text: #15803d;
      --gradient-hero: radial-gradient(circle at 20% 20%, rgba(28,155,107,0.16), transparent 60%),
        radial-gradient(circle at 80% 0%, rgba(43,123,199,0.14), transparent 55%),
        linear-gradient(140deg, #f8f6f1 0%, #f1ece3 50%, #ffffff 100%);
    }
    html[data-theme="dark"] {
      --bg-elevated: #141825; --bg-soft: #1a2032;
      --text: #eef1f7; --text-muted: #9aa4b7;
      --accent: #73d1ff; --accent-3: #f3a05f;
      --border: rgba(255,255,255,0.08);
      --error-text: #fca5a5; --success-text: #86efac;
      --gradient-hero: radial-gradient(circle at 20% 20%, rgba(115,209,255,0.25), transparent 60%),
        radial-gradient(circle at 80% 0%, rgba(140,243,178,0.18), transparent 55%),
        linear-gradient(145deg, #0b0d12 0%, #0f1421 55%, #0b0d12 100%);
    }

    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--gradient-hero);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Wide enough to stop wasting a large screen, capped so a line of text
       stays a readable length. */
    .page-content { max-width: min(1400px, 100%); margin: 0 auto; padding: 32px 24px 64px; }

    /* FilaMan serves this page outside its own shell, so the navigation drawer
       is not there. Until FilaMan can embed a plugin page, this is the way
       back, and it looks like a button because a muted line of text is not
       something anybody finds. See docs/01_Design.md section 8.1. */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      transition: color var(--transition), border-color var(--transition);
    }
    /* The arrow is a pseudo element on purpose: data-i18n replaces the text
       content of the link, and a child element would be wiped with it. */
    .back-link::before { content: "\2190"; font-size: 1rem; line-height: 1; }
    .back-link:hover {
      color: var(--accent);
      border-color: var(--accent);
      text-decoration: none;
    }

    .hero { margin-bottom: 28px; }
    .hero h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .hero p { color: var(--text-muted); max-width: 62ch; margin-top: 6px; }

    .fm-card {
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .fm-card-header {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted);
      transition: background var(--transition);
    }
    .dot.ok { background: var(--success-text); }
    .dot.bad { background: var(--error-text); }

    .message {
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      border-left: 3px solid var(--error-text);
      background: var(--bg-elevated);
      color: var(--error-text);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .printer {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .printer:first-child { border-top: none; }
    .printer-name { font-weight: 600; }
    .printer-detail { color: var(--text-muted); font-size: 0.88rem; }
    .printer-error { color: var(--error-text); font-size: 0.85rem; width: 100%; }

    /* The running print stands apart, which is the whole point of it. */
    .running-card { border-color: var(--accent); }

    /* How far along the print is, which is what somebody standing in front of
       the printer came to the page for. The number leads, the bar follows. */
    .live-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 6px 0 8px;
    }
    .live-percent {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      /* Fixed, so the bar does not jump when the number grows a digit. */
      min-width: 2.8em;
    }
    .bar {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width var(--transition);
    }

    .print {
      display: grid;
      grid-template-columns: var(--preview-size) 1fr;
      gap: 18px;
      padding: 20px 0 20px 14px;
      border-top: 1px solid var(--border);
      /* The strip answers one question: does this print still want something
         from me. The badge next to the status says the same in words, because
         a colour alone is not an answer for everyone. */
      border-left: 3px solid transparent;
    }
    .print.state-running { border-left-color: var(--accent); }
    .print.state-booked { border-left-color: var(--success-text); }
    .print.state-open { border-left-color: var(--accent-3); }
    .print.state-failed { border-left-color: var(--error-text); }
    .print:first-child { border-top: none; }
    .print-preview {
      width: var(--preview-size); height: var(--preview-size);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-soft);
      object-fit: contain;
    }
    /* Where no preview was stored the column stays, so every card in the list
       lines up, but an empty frame this size would read as a broken image. */
    div.print-preview { border: none; background: none; }

    /* A grid column defaults to min-width auto, which lets a wide table push
       past the card instead of scrolling inside it. */
    .print-body { min-width: 0; }

    .print-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px 16px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .print-title { font-weight: 600; word-break: break-all; }
    .print-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .print-problem {
      color: var(--error-text);
      font-size: 0.85rem;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .print-meta {
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    /* The separator lives in CSS because it is punctuation, not language, and
       it must not appear in front of the first fact. */
    .print-meta span + span::before { content: "\00b7"; margin-right: 8px; }
    .badge {
      /* inline-flex, not inline-block: a flex item stretches to the height of
         its row, and the text would then sit at the top of a pill that is
         taller than it needs to be. */
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    /* The colour carries the meaning, the word does not. The light theme's
       green on the light theme's ground is 4.26 to 1, which is under the line
       for text this size, so the word stays text coloured and the colour moves
       into the outline and a tint behind it. */
    .badge.good, .badge.bad, .badge.open, .badge.live {
      color: var(--text);
      font-weight: 600;
    }
    .badge.good {
      border-color: var(--success-text);
      background: color-mix(in srgb, var(--success-text) 16%, transparent);
    }
    .badge.bad {
      border-color: var(--error-text);
      background: color-mix(in srgb, var(--error-text) 16%, transparent);
    }
    .badge.open {
      border-color: var(--accent-3);
      background: color-mix(in srgb, var(--accent-3) 16%, transparent);
    }
    .badge.live {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }

    /* The outcome of the print, which is the one thing to be readable across
       the room. Everything else next to it stays a quiet outline. */
    .badge.status {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 12px;
      color: var(--text);
    }

    /* One block per filament instead of a table row. A print has two or three
       of these, and each carries three lines that belong together; a table made
       every one of them scroll sideways on a phone for no gain. */
    .filaments { display: grid; gap: 8px; margin-top: 12px; }
    .filament {
      display: grid;
      grid-template-columns: var(--swatch-width) 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .filament.needs-spool {
      border-color: var(--accent-3);
      background: color-mix(in srgb, var(--accent-3) 10%, transparent);
    }
    .filament-color {
      align-self: stretch;
      min-height: 40px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .filament-text { min-width: 0; }
    .filament-what { font-weight: 600; font-size: 0.9rem; }
    /* Slot and span sit beside the material without competing with it. */
    .filament-what span {
      margin-left: 8px;
      font-weight: 400;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .filament-spool { font-size: 0.86rem; word-break: break-word; }
    .filament-figures { color: var(--text-muted); font-size: 0.8rem; }

    .icon-button {
      font-family: inherit;
      font-size: 1rem;
      line-height: 1;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition);
    }
    .icon-button:hover { color: var(--accent); border-color: var(--accent); }
    .icon-button:disabled { opacity: 0.5; cursor: default; }

    .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    select { max-width: 320px; }

    select, input[type="number"], input[type="text"] {
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      max-width: 100%;
    }
    input[type="number"] { width: 92px; }

    .button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: #0b1410;
      background: var(--accent);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      cursor: pointer;
      transition: filter var(--transition);
    }
    .button:hover { filter: brightness(1.08); }
    .button:disabled { opacity: 0.5; cursor: default; }
    .button.ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .check input { margin-top: 6px; }
    .field { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .hint { color: var(--text-muted); font-size: 0.82rem; margin: -4px 0 16px; max-width: 62ch; }
    .saved { color: var(--success-text); font-size: 0.85rem; margin-left: 10px; }
    .empty { color: var(--text-muted); font-size: 0.9rem; }

    /* One overlay for everything that needs the whole window: the plate
       preview at its real size, and the spool picker. */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .overlay[hidden] { display: none; }
    .overlay-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      max-width: min(900px, 100%);
      max-height: 100%;
      overflow: auto;
    }
    .overlay-close {
      /* Sticky rather than absolute: the box itself scrolls once the window is
         shorter than the picker, and a way out that scrolls out of sight is no
         way out. Floated so the content keeps the full width underneath. */
      position: sticky;
      top: 0;
      float: right;
      z-index: 1;
      /* Opaque, because once the box scrolls the content passes underneath. */
      background: var(--bg-elevated);
    }
    .overlay-image {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      border-radius: var(--radius-sm);
    }

    .icon {
      width: 1.05em;
      height: 1.05em;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Every fact and every badge becomes a small row of icon plus word, which
       is also what keeps the two aligned when the line wraps. */
    .print-meta span, .badge { display: inline-flex; align-items: center; gap: 6px; }
    .icon-button .icon { width: 1.1em; height: 1.1em; }

    .icon-button.danger:hover { color: var(--error-text); border-color: var(--error-text); }
    .confirm { max-width: 46ch; }
    .confirm-explain { color: var(--text-muted); font-size: 0.86rem; margin: 10px 0 16px; }
    .danger-button {
      color: var(--text);
      background: color-mix(in srgb, var(--error-text) 22%, transparent);
      border-color: var(--error-text);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 4px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .filters .check { margin-bottom: 0; }
    .filters .check input { margin-top: 0; }
    .search { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
    .search input { flex: 1; }
    .search .icon { color: var(--text-muted); }

    .print-preview { cursor: zoom-in; }

    .picker { min-width: min(620px, 78vw); }
    .picker-head { margin-bottom: 12px; }
    .picker-section { margin-bottom: 14px; }
    .picker-label {
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .picker-title {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 600;
    }
    .picker-wanted { color: var(--text-muted); font-size: 0.85rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      font-family: inherit;
      font-size: 0.8rem;
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .chip.on { border-color: var(--accent); color: var(--accent); }
    .picker-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .picker-tools input[type="text"] { flex: 1; min-width: 160px; }
    .picker-list {
      max-height: 52vh;
      overflow: auto;
      border-top: 1px solid var(--border);
    }
    .picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--border);
    }
    .picker-color {
      width: var(--swatch-width);
      height: 36px;
      border-radius: 4px;
      border: 1px solid var(--border);
      flex: none;
    }
    .picker-text { flex: 1; min-width: 0; }
    .picker-name { font-weight: 600; font-size: 0.9rem; }
    .picker-detail { color: var(--text-muted); font-size: 0.82rem; }

    footer { color: var(--text-muted); font-size: 0.8rem; text-align: center; margin-top: 32px; }

    @media (max-width: 620px) {
      .print { grid-template-columns: 1fr; }
      .print-preview { width: 100%; height: auto; max-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="page-content">

    <a class="back-link" href="/" data-i18n="page.back"></a>

    <div class="hero">
      <h1 data-i18n="page.title"></h1>
      <p data-i18n="page.subtitle"></p>
    </div>

    <div id="message" class="message" hidden></div>

    <section class="fm-card">
      <div class="card-head">
        <h2 class="fm-card-header" data-i18n="status.heading"></h2>
        <span class="pill">
          <span class="dot" id="health-dot"></span>
          <span id="health-label" data-i18n="status.checking"></span>
          <span id="health-version"></span>
        </span>
      </div>
      <div id="printers"></div>
    </section>

    <section class="fm-card running-card" id="running-card" hidden>
      <h2 class="fm-card-header" data-i18n="history.running"></h2>
      <div id="running"></div>
    </section>

    <section class="fm-card">
      <h2 class="fm-card-header" data-i18n="history.heading"></h2>

      <div class="filters">
        <label class="search">
          <input type="text" id="history-search" data-i18n-placeholder="history.search" />
        </label>
        <label class="check">
          <input type="checkbox" id="history-hide-failed" />
          <span data-i18n="history.hideFailed"></span>
        </label>
        <select id="history-order">
          <option value="newest" data-i18n="history.orderNewest"></option>
          <option value="oldest" data-i18n="history.orderOldest"></option>
          <option value="largest" data-i18n="history.orderLargest"></option>
        </select>
      </div>

      <div id="history"></div>
      <button type="button" id="load-more" class="button ghost" data-i18n="history.loadMore" hidden></button>
    </section>

    <section class="fm-card">
      <h2 class="fm-card-header" data-i18n="settings.heading"></h2>
      <form id="settings-form">
        <div class="field">
          <span data-i18n="settings.scope"></span>
          <select id="settings-scope"></select>
        </div>
        <label class="check">
          <input type="checkbox" id="tracking-enabled" />
          <span data-i18n="settings.tracking"></span>
        </label>
        <label class="check">
          <input type="checkbox" id="auto-spend" />
          <span data-i18n="settings.autoSpend"></span>
        </label>
        <label class="check">
          <input type="checkbox" id="spend-on-cancel" />
          <span data-i18n="settings.spendOnCancel"></span>
        </label>
        <div class="field">
          <span data-i18n="settings.retention"></span>
          <input type="number" id="retention" min="0" step="1" />
        </div>
        <p class="hint" data-i18n="settings.retentionHint"></p>
        <button type="submit" class="button" data-i18n="settings.save"></button>
        <span id="settings-saved" class="saved" data-i18n="settings.saved" hidden></span>
      </form>
    </section>

    <footer data-i18n="page.footer"></footer>
  </div>

  <!-- The icon set. Inline, because the plugin ZIP rejects .svg files, and as
       templates so icon() can clone one without innerHTML. Every one of them
       draws in currentColor and therefore in the colour of whatever it sits
       next to, in all three themes. -->
    <template id="icon-printer"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 15h12v6H6z"/></svg></template>
    <template id="icon-cloud"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 18a4.5 4.5 0 0 1 .4-9 5.5 5.5 0 0 1 10.5 1.3A3.9 3.9 0 0 1 17.5 18z"/></svg></template>
    <template id="icon-drive"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 13h18"/><path d="M7.5 16.5h.01"/></svg></template>
    <template id="icon-clock"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.2 2"/></svg></template>
    <template id="icon-layers"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7.5 12 12l9-4.5L12 3z"/><path d="m3 12.5 9 4.5 9-4.5"/><path d="m3 17 9 4.5 9-4.5"/></svg></template>
    <template id="icon-weight"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></template>
    <template id="icon-tag"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 12.9 21a1.9 1.9 0 0 1-2.7 0l-7.1-7.1V3h10.9l6.6 6.6a2.7 2.7 0 0 1 0 3.8z"/><path d="M7.5 7.5h.01"/></svg></template>
    <template id="icon-objects"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8.5" r="4.5"/><rect x="12.5" y="12.5" width="8" height="8" rx="1.5"/></svg></template>
    <template id="icon-nozzle"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v5.5l-4 12.5h-2L7 8.5V3z"/><path d="M7 8.5h10"/></svg></template>
    <template id="icon-pencil"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5h4.2l10.4-10.4a3 3 0 0 0-4.2-4.2L4 16.3v4.2z"/><path d="m13.8 7.2 3 3"/></svg></template>
    <template id="icon-close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11"/><path d="m17.5 6.5-11 11"/></svg></template>
    <template id="icon-trash"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 7V4h4v3"/><path d="m6.5 7 1 13h9l1-13"/></svg></template>
    <template id="icon-search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.6-4.6"/></svg></template>
    <template id="icon-check"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4.5 4.5L19 6.5"/></svg></template>
    <template id="icon-failed"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6"/><path d="m15 9-6 6"/></svg></template>
    <template id="icon-running"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg></template>
    <template id="icon-warning"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.5 20.5h19L12 3.5z"/><path d="M12 10v4.2"/><path d="M12 17.5h.01"/></svg></template>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-box" id="overlay-box"></div>
  </div>

  <script>
    (function () {
      'use strict';

      // Reading goes to the plugin's own mount, writing to /api/v1, because
      // FilaMan's CSRF protection only guards paths below it. See router.py.
      var MOUNT = '/bambu-usage';
      var ADMIN = '/api/v1/plugins/bambu-usage';

      // Four, because one of them may be the print that is running and moves
      // into its own card. Three finished ones are what fits without scrolling.
      var HISTORY_INITIAL = 4;
      var HISTORY_VISIBLE = 3;
      var HISTORY_MORE = 10;
      var STATUS_INTERVAL_MS = 10000;
      var SPOOL_PAGE_SIZE = 200;
      var SPOOL_PAGE_LIMIT = 10;
      var GLOBAL_PRINTER_ID = 0;
      var EXTERNAL_SLOT_INDEX = '255-254';
      var SAVED_VISIBLE_MS = 2500;
      var SEARCH_DELAY_MS = 300;

      // Written out rather than built from the status string, so every key is
      // visible to the test that checks the dictionaries against the page.
      var STATUS_KEYS = {
        running: 'printStatus.running',
        finished: 'printStatus.finished',
        failed: 'printStatus.failed',
        cancelled: 'printStatus.cancelled',
        incomplete: 'printStatus.incomplete',
        no_3mf: 'printStatus.no3mf'
      };
      var GOOD_STATUS = { finished: true };
      var BAD_STATUS = { failed: true, cancelled: true };

      // Where the job came from. A printer that reports something else shows
      // what it said rather than nothing.
      var PRINT_TYPE_KEYS = {
        cloud: 'printType.cloud',
        local: 'printType.local'
      };

      // Which icon says what. Written out rather than built from the value, so
      // a missing one is a missing template and not a silent blank.
      var TYPE_ICONS = { cloud: 'cloud', local: 'drive' };
      var STATUS_ICONS = {
        running: 'running',
        finished: 'check',
        failed: 'failed',
        cancelled: 'failed',
        incomplete: 'warning',
        no_3mf: 'warning'
      };

      var dictionary = {};
      var spools = new Map();
      var printers = [];
      var settingsRows = new Map();
      var historyOffset = 0;
      // What the list is filtered by right now. On the server, so that the
      // pages behind the button are filtered as well.
      var historyFilter = { search: '', hideFailed: false, order: 'newest' };
      var searchTimer = null;
      var currency = '';
      var runningIds = new Set();
      var booted = false;

      /* ── translation ─────────────────────────────────────────── */

      function resolve(key) {
        return key.split('.').reduce(function (node, part) {
          return node && typeof node === 'object' ? node[part] : undefined;
        }, dictionary);
      }

      function t(key, values) {
        var text = resolve(key);
        if (typeof text !== 'string') return key;
        if (!values) return text;
        return text.replace(/\{(\w+)\}/g, function (match, name) {
          return values[name] === undefined ? match : values[name];
        });
      }

      function translatePage() {
        document.querySelectorAll('[data-i18n]').forEach(function (element) {
          element.textContent = t(element.getAttribute('data-i18n'));
        });
        document.querySelectorAll('[data-i18n-title]').forEach(function (element) {
          element.title = t(element.getAttribute('data-i18n-title'));
        });
      }

      function language() {
        // The same contract FilaMan's own interface uses, so this page follows
        // whatever language was selected there. See docs/01_Design.md section 9.
        return localStorage.getItem('lang') || 'en';
      }

      function loadDictionary() {
        return fetch(MOUNT + '/i18n/' + encodeURIComponent(language()), {
          headers: { 'Accept': 'application/json' }
        }).then(function (response) {
          return response.ok ? response.json() : {};
        }).then(function (data) {
          dictionary = data;
          document.documentElement.lang = language();
          translatePage();
        });
      }

      /* ── talking to the two APIs ─────────────────────────────── */

      function read(path) {
        return fetch(path, {
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        }).then(unwrap);
      }

      function write(path, body) {
        var token = (document.cookie.split('; ').find(function (entry) {
          return entry.indexOf('csrf_token=') === 0;
        }) || '').split('=')[1];

        return fetch(path, {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'X-CSRF-Token': token || ''
          },
          body: JSON.stringify(body)
        }).then(unwrap);
      }

      function put(path, body) {
        var token = (document.cookie.split('; ').find(function (entry) {
          return entry.indexOf('csrf_token=') === 0;
        }) || '').split('=')[1];

        return fetch(path, {
          method: 'PUT',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'X-CSRF-Token': token || ''
          },
          body: JSON.stringify(body)
        }).then(unwrap);
      }

      function unwrap(response) {
        if (response.status === 204) return null;
        return response.json().catch(function () {
          return null;
        }).then(function (data) {
          if (response.ok) return data;
          // The backend hands out a stable code and an English fallback. The
          // code is what this page translates. See docs/01_Design.md section 9.
          var detail = data && data.detail ? data.detail : {};
          var message = detail.code ? t(detail.code) : null;
          throw new Error(message || detail.message || t('errors.generic'));
        });
      }

      function complain(error) {
        var box = document.getElementById('message');
        box.textContent = error && error.message ? error.message : t('errors.generic');
        box.hidden = false;
      }

      function clearComplaint() {
        document.getElementById('message').hidden = true;
      }

      /* ── small builders ──────────────────────────────────────── */

      function icon(name) {
        // Cloned from a template rather than built: an SVG element needs its
        // namespace, and createElement would quietly produce an HTML one.
        var template = document.getElementById('icon-' + name);
        return template ? template.content.firstElementChild.cloneNode(true) : null;
      }

      function withIcon(node, name) {
        var drawing = icon(name);
        if (drawing) node.insertBefore(drawing, node.firstChild);
        return node;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        // Always textContent: a file name comes off a printer and is not ours
        // to trust with innerHTML.
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }

      function link(text, href) {
        // A link only where there is something to open, plain text otherwise,
        // so nothing looks clickable that is not.
        if (!href) return document.createTextNode(text);

        var anchor = el('a', null, text);
        anchor.href = href;
        return anchor;
      }

      function grams(value) {
        return value === null || value === undefined ? '-' : value.toFixed(1) + ' g';
      }

      function moment(value) {
        return value ? new Date(value).toLocaleString() : '';
      }

      function day(value) {
        return value ? new Date(value).toLocaleDateString() : '';
      }

      function clock(value) {
        return value ? new Date(value).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      }

      /* ── printers ────────────────────────────────────────────── */

      function refreshStatus() {
        return read(MOUNT + '/health').then(function (health) {
          var dot = document.getElementById('health-dot');
          var label = document.getElementById('health-label');
          dot.className = 'dot ok';
          label.textContent = t('status.mounted');
          document.getElementById('health-version').textContent =
            t('status.version') + ' ' + health.version;
          currency = health.currency || '';
        }).catch(function () {
          document.getElementById('health-dot').className = 'dot bad';
          document.getElementById('health-label').textContent = t('status.unreachable');
        }).then(function () {
          return read(MOUNT + '/status');
        }).then(function (rows) {
          printers = rows || [];
          renderPrinters();

          var next = new Set();
          printers.forEach(function (printer) {
            if (printer.current_print_id) next.add(printer.current_print_id);
          });

          var changed = next.size !== runningIds.size
            || Array.from(next).some(function (id) { return !runningIds.has(id); });
          runningIds = next;
          updateRunningLive();

          if (!booted) return null;
          // A print that started or ended moves between the two cards, and only
          // a fresh history knows which one it belongs in now.
          if (changed) return loadHistory(true);
          return refreshRunning();
        });
      }

      function renderPrinters() {
        var target = document.getElementById('printers');
        target.textContent = '';

        if (!printers.length) {
          target.appendChild(el('p', 'empty', t('status.none')));
          return;
        }

        printers.forEach(function (printer) {
          var row = el('div', 'printer');
          row.appendChild(el('span', 'printer-name', printer.printer_name));

          var state = el('span', 'badge');
          if (!printer.tracking_enabled) {
            state.textContent = t('status.trackingOff');
          } else if (printer.connected) {
            state.textContent = t('status.connected');
            state.classList.add('good');
          } else {
            state.textContent = t('status.disconnected');
            state.classList.add('bad');
          }
          row.appendChild(state);

          var running = Boolean(printer.current_file_name);
          var detail = running
            ? t('status.printing', { file: printer.current_file_name })
            : t('status.idle');
          // A percentage next to "no print running" is noise, and the printer
          // keeps reporting the last one long after it ended.
          if (running && printer.progress_percent !== null && printer.progress_percent !== undefined) {
            detail += ' (' + printer.progress_percent + '%)';
          }
          row.appendChild(el('span', 'printer-detail', detail));

          if (printer.updated_at) {
            row.appendChild(el('span', 'printer-detail',
              t('status.updated', { time: moment(printer.updated_at) })));
          }

          if (printer.last_error) {
            row.appendChild(el('span', 'printer-error', t('status.lastError') + ': ' + printer.last_error));
          }

          target.appendChild(row);
        });
      }

      function printerName(printerId) {
        var match = printers.find(function (printer) {
          return printer.printer_id === printerId;
        });
        return match ? match.printer_name : String(printerId);
      }

      /* ── spools, straight from FilaMan ───────────────────────── */

      function loadSpools() {
        spools.clear();
        return fetchSpoolPage(1);
      }

      function fetchSpoolPage(page) {
        var query = '/api/v1/spools?page=' + page + '&page_size=' + SPOOL_PAGE_SIZE;
        return read(query).then(function (data) {
          var items = (data && data.items) || [];
          items.forEach(function (spool) {
            var filament = spool.filament || {};
            var colors = filament.colors || [];
            spools.set(spool.id, {
              label: spoolLabel(spool),
              filamentId: filament.id,
              material: filament.material_type || '',
              color: normalizeColor(colors.length && colors[0].color ? colors[0].color.hex_code : ''),
              maker: filament.manufacturer ? filament.manufacturer.name : '',
              designation: filament.designation || '',
              remaining: spool.remaining_weight_g,
              lastUsed: spool.last_used_at
            });
          });
          var seen = page * SPOOL_PAGE_SIZE;
          if (data && data.total > seen && page < SPOOL_PAGE_LIMIT) {
            return fetchSpoolPage(page + 1);
          }
          return null;
        }).catch(function () {
          // The history is still worth showing without spool names.
          complain(new Error(t('errors.spoolsUnavailable')));
        });
      }

      function spoolLabel(spool) {
        var filament = spool.filament || {};
        var parts = [];
        if (filament.manufacturer && filament.manufacturer.name) parts.push(filament.manufacturer.name);
        if (filament.designation) parts.push(filament.designation);
        // Only a real colour name. Several of these hold a bare hex code, which
        // says nothing next to a designation that already names the colour.
        if (filament.manufacturer_color_name && !isHex(filament.manufacturer_color_name)) {
          parts.push(filament.manufacturer_color_name);
        }
        if (spool.remaining_weight_g !== null && spool.remaining_weight_g !== undefined) {
          parts.push(grams(spool.remaining_weight_g));
        }
        return '#' + spool.id + ' ' + parts.join(', ');
      }

      function isHex(value) {
        return /^#?[0-9a-f]{6,8}$/i.test(String(value).trim());
      }

      function normalizeColor(value) {
        // The 3MF writes #RRGGBB, a tray reports RRGGBBAA, FilaMan stores
        // #rrggbb. Six hex digits are what they have in common.
        if (!value) return '';
        var hex = String(value).replace('#', '').toLowerCase();
        return hex.length >= 6 ? hex.slice(0, 6) : hex;
      }

      function sameMaterial(a, b) {
        return Boolean(a) && Boolean(b) && String(a).trim().toUpperCase() === String(b).trim().toUpperCase();
      }

      function spoolName(spoolId) {
        if (spoolId === null || spoolId === undefined) return t('history.unassigned');
        var spool = spools.get(spoolId);
        return spool ? spool.label : '#' + spoolId;
      }

      /* ── history ─────────────────────────────────────────────── */

      function loadHistory(reset) {
        if (reset) historyOffset = 0;
        var size = reset ? HISTORY_INITIAL : HISTORY_MORE;
        var query = MOUNT + '/history?limit=' + size + '&offset=' + historyOffset
          + filterQuery();

        return read(query).then(function (records) {
          var target = document.getElementById('history');
          var running = document.getElementById('running');
          if (reset) {
            target.textContent = '';
            running.textContent = '';
          }

          var finished = 0;
          var shown = 0;
          var held = 0;

          records.forEach(function (record) {
            if (runningIds.has(record.id)) {
              running.appendChild(renderPrint(record, true));
              shown += 1;
              return;
            }
            // A long history makes the page long. Three is what fits, the rest
            // is behind the button, and what is not shown is not counted into
            // the offset either.
            if (reset && finished >= HISTORY_VISIBLE) {
              held += 1;
              return;
            }
            target.appendChild(renderPrint(record, false));
            finished += 1;
            shown += 1;
          });

          document.getElementById('running-card').hidden = !running.firstChild;
          if (reset && !finished) {
            // Two different emptinesses: nothing recorded at all, or nothing
            // left after filtering. Saying "no print yet" to somebody who just
            // typed a search term would send them looking for a bug.
            var filtering = historyFilter.search || historyFilter.hideFailed;
            target.appendChild(el('p', 'empty', t(filtering ? 'history.noMatch' : 'history.none')));
          }

          historyOffset += shown;
          document.getElementById('load-more').hidden = !held && records.length < size;
          updateRunningLive();
        });
      }

      function filterQuery() {
        var parts = ['&order=' + encodeURIComponent(historyFilter.order)];
        if (historyFilter.search) {
          parts.push('&search=' + encodeURIComponent(historyFilter.search));
        }
        if (historyFilter.hideFailed) parts.push('&hide_failed=true');
        return parts.join('');
      }

      function refreshRunning() {
        // What a running print has used grows with every layer, so its card is
        // fetched again on every poll. Only that card is replaced: the finished
        // list keeps its scroll position and however much of it is unfolded.
        if (!runningIds.size) return Promise.resolve(null);

        return read(MOUNT + '/history?limit=' + HISTORY_INITIAL + '&offset=0').then(function (records) {
          var running = document.getElementById('running');
          running.textContent = '';

          records.forEach(function (record) {
            if (runningIds.has(record.id)) running.appendChild(renderPrint(record, true));
          });

          document.getElementById('running-card').hidden = !running.firstChild;
          updateRunningLive();
        });
      }

      function updateRunningLive() {
        // Redrawn on every poll, so the bar follows the printer without the
        // history being fetched again.
        var host = document.getElementById('running-live');
        if (!host) return;

        var printer = printers.find(function (entry) { return entry.current_print_id; });
        host.textContent = '';
        if (!printer) return;

        var percent = printer.progress_percent === null || printer.progress_percent === undefined
          ? 0 : printer.progress_percent;

        var bar = el('div', 'bar');
        var fill = el('div', 'bar-fill');
        fill.style.width = percent + '%';
        bar.appendChild(fill);

        var head = el('div', 'live-head');
        head.appendChild(el('span', 'live-percent', percent + '%'));
        head.appendChild(bar);
        host.appendChild(head);

        var line = el('div', 'print-meta');

        if (printer.layer_num && printer.total_layer_num) {
          line.appendChild(el('span', null, t('history.layer', {
            layer: printer.layer_num,
            total: printer.total_layer_num
          })));
        }
        if (printer.remaining_minutes) {
          line.appendChild(el('span', null, t('history.remaining', {
            minutes: printer.remaining_minutes,
            end: endOfPrint(printer.remaining_minutes)
          })));
        }

        var link = el('a', null, t('history.openPrinter'));
        link.href = '/printers/' + printer.printer_id;
        line.appendChild(link);

        host.appendChild(line);
      }

      function endOfPrint(minutes) {
        return clock(new Date(Date.now() + minutes * 60000));
      }

      function renderPrint(record, isRunning) {
        var wrapper = el('div', 'print');
        wrapper.classList.add('state-' + printState(record, isRunning));

        if (record.has_thumbnail) {
          var preview = el('img', 'print-preview');
          preview.src = MOUNT + '/thumb/' + record.id;
          preview.alt = t('history.preview');
          preview.title = t('history.preview');
          preview.addEventListener('click', function () {
            var large = el('img', 'overlay-image');
            large.src = preview.src;
            large.alt = preview.alt;
            openOverlay(large);
          });
          wrapper.appendChild(preview);
        } else {
          wrapper.appendChild(el('div', 'print-preview'));
        }

        var body = el('div', 'print-body');
        body.appendChild(printHead(record, isRunning));
        body.appendChild(printFacts(record));

        // A booking that failed is skipped so the other spools still go
        // through. Saying so here is what keeps that from being invisible.
        if (record.error) {
          body.appendChild(el('div', 'print-problem',
            t('history.bookingFailed') + ': ' + record.error));
        }

        if (isRunning) {
          // Filled by updateRunningLive on every poll, so the live figures do
          // not depend on the history being reloaded.
          var live = el('div');
          live.id = 'running-live';
          body.appendChild(live);
        }

        var list = el('div', 'filaments');
        record.filaments.forEach(function (usage) {
          list.appendChild(filamentBlock(usage, isRunning));
        });
        body.appendChild(list);

        wrapper.appendChild(body);
        return wrapper;
      }

      function printHead(record, isRunning) {
        var head = el('div', 'print-head');
        head.appendChild(el('div', 'print-title', record.file_name));

        var badges = el('div', 'print-badges');
        var key = STATUS_KEYS[record.status];
        var badge = el('span', 'badge status', key ? t(key) : record.status);
        if (STATUS_ICONS[record.status]) withIcon(badge, STATUS_ICONS[record.status]);
        if (isRunning) badge.classList.add('live');
        if (GOOD_STATUS[record.status]) badge.classList.add('good');
        if (BAD_STATUS[record.status]) badge.classList.add('bad');
        badges.appendChild(badge);

        if (record.completed_fraction !== null && record.completed_fraction !== undefined
            && BAD_STATUS[record.status]) {
          badges.appendChild(el('span', 'badge', t('history.stoppedAt', {
            percent: Math.round(record.completed_fraction * 100)
          })));
        }

        if (record.spent) {
          badges.appendChild(withIcon(el('span', 'badge good', t('history.stateBooked')), 'check'));
        } else if (unassigned(record)) {
          badges.appendChild(withIcon(el('span', 'badge open', t('history.openWork')), 'warning'));
        }

        if (record.cost !== null && record.cost !== undefined) {
          badges.appendChild(withIcon(el('span', 'badge', t('history.cost', {
            amount: record.cost.toFixed(2),
            currency: currency
          })), 'tag'));
        }

        var soFar = usedSoFar(record);
        if (isRunning && soFar !== null) {
          badges.appendChild(el('span', 'badge', t('history.usedSoFar', {
            grams: grams(soFar)
          })));
        }

        // Not while it runs: booking now would charge the full estimate for
        // material still on the spool. The end books it by itself.
        // Never on a running print: it has not finished being what it is.
        if (!isRunning) badges.appendChild(deleteButton(record));

        if (!isRunning && !record.spent && bookable(record)) {
          var book = el('button', 'button ghost', t('history.book'));
          book.type = 'button';
          book.addEventListener('click', function () {
            act(book, write(ADMIN + '/print/' + record.id + '/spend', {}));
          });
          badges.appendChild(book);
        }

        head.appendChild(badges);
        return head;
      }

      function usedSoFar(record) {
        // Null rather than zero when no filament has an answer, because "0 g so
        // far" and "nobody knows yet" are different things.
        var total = null;
        record.filaments.forEach(function (usage) {
          if (usage.used_so_far === null || usage.used_so_far === undefined) return;
          total = (total || 0) + usage.used_so_far;
        });
        return total;
      }

      function deleteButton(record) {
        var button = withIcon(el('button', 'icon-button danger'), 'trash');
        button.type = 'button';
        button.title = t('history.delete');
        button.setAttribute('aria-label', t('history.delete'));
        button.addEventListener('click', function () { askToDelete(record); });
        return button;
      }

      function askToDelete(record) {
        // Asked in our own window rather than through confirm(): a browser
        // dialog cannot be translated and blocks everything behind it.
        var box = el('div', 'confirm');
        box.appendChild(el('div', 'picker-title', t('history.deleteHeading')));
        box.appendChild(el('p', 'picker-detail', record.file_name));
        box.appendChild(el('p', 'confirm-explain', t('history.deleteExplain')));

        var actions = el('div', 'row-actions');
        var go = el('button', 'button danger-button', t('history.deleteConfirm'));
        go.type = 'button';
        go.addEventListener('click', function () {
          closeOverlay();
          act(go, write(ADMIN + '/print/' + record.id + '/delete', {}));
        });
        actions.appendChild(go);

        var never = el('button', 'button ghost', t('history.cancel'));
        never.type = 'button';
        never.addEventListener('click', closeOverlay);
        actions.appendChild(never);

        box.appendChild(actions);
        openOverlay(box);
      }

      function printFacts(record) {
        var facts = el('div', 'print-meta');
        var add = function (text, name) {
          if (text) facts.appendChild(withIcon(el('span', null, text), name));
        };

        add(printerName(record.printer_id), 'printer');

        if (record.print_type) {
          var typeKey = PRINT_TYPE_KEYS[record.print_type];
          add(typeKey ? t(typeKey) : record.print_type, TYPE_ICONS[record.print_type] || 'cloud');
        }

        facts.appendChild(el('span', null, timespan(record)));

        // What it took where it is over, what the slicer promised where it is
        // not. Two answers to one question, so only ever one of them shows.
        add(duration(record) || estimate(record), 'clock');
        add(totalGrams(record), 'weight');

        if (record.layer_count) {
          add(t('history.layers', { count: record.layer_count }), 'layers');
        }
        if (record.object_count) {
          add(t(record.object_count === 1 ? 'history.object' : 'history.objects', {
            count: record.object_count
          }), 'objects');
        }
        if (record.nozzle_diameter) {
          add(t('history.nozzle', { mm: record.nozzle_diameter }), 'nozzle');
        }
        return facts;
      }

      function totalGrams(record) {
        // The sum of the rows rather than a stored total: the same number, and
        // one that stays right when a row is corrected by hand.
        var total = null;
        record.filaments.forEach(function (usage) {
          if (usage.estimated_grams === null || usage.estimated_grams === undefined) return;
          total = (total || 0) + usage.estimated_grams;
        });
        return total === null ? null : grams(total);
      }

      function estimate(record) {
        if (!record.estimated_seconds) return null;
        return t('history.estimate', { duration: humanMinutes(Math.round(record.estimated_seconds / 60)) });
      }

      function duration(record) {
        // Nothing while it runs: the remaining time already stands next to it,
        // and a duration growing beside that is one number too many.
        if (!record.started_at || !record.finished_at) return null;

        var minutes = Math.round(
          (new Date(record.finished_at) - new Date(record.started_at)) / 60000);
        // Two clocks that disagree can put the end before the start, and a
        // negative duration says less than nothing.
        if (minutes < 0) return null;

        return humanMinutes(minutes);
      }

      function humanMinutes(minutes) {
        var hours = Math.floor(minutes / 60);
        return hours
          ? t('history.durationHours', { hours: hours, minutes: minutes % 60 })
          : t('history.durationMinutes', { minutes: minutes });
      }

      function timespan(record) {
        var started = day(record.started_at) + ' ' + clock(record.started_at);
        if (!record.finished_at) return started;

        // The date is worth saying once. A print that runs past midnight is the
        // reason the second one is not simply dropped.
        var sameDay = new Date(record.started_at).toDateString()
          === new Date(record.finished_at).toDateString();
        var ended = sameDay
          ? clock(record.finished_at)
          : day(record.finished_at) + ' ' + clock(record.finished_at);
        return t('history.timespan', { from: started, to: ended });
      }

      function printState(record, isRunning) {
        // Not the outcome of the print, which the status badge already says,
        // but whether it is waiting for a human.
        if (isRunning) return 'running';
        if (record.error) return 'failed';
        if (unassigned(record) || bookable(record)) return 'open';
        if (record.spent) return 'booked';
        return 'none';
      }

      function unassigned(record) {
        return record.filaments.some(function (usage) {
          return usage.spool_id === null || usage.spool_id === undefined;
        });
      }

      function bookable(record) {
        return record.filaments.some(function (usage) {
          return usage.spool_id !== null && usage.spool_id !== undefined && !usage.spent_at;
        });
      }

      function filamentBlock(usage, isRunning) {
        var assigned = usage.spool_id !== null && usage.spool_id !== undefined;
        var block = el('div', assigned ? 'filament' : 'filament needs-spool');

        var colour = el('div', 'filament-color');
        if (usage.color_hex) colour.style.background = usage.color_hex;
        block.appendChild(colour);

        var text = el('div', 'filament-text');
        text.appendChild(filamentWhat(usage));

        // The material is what the slicer asked for; the link goes to the spool
        // that answered for it, which is what somebody would want to open.
        var named = el('div', 'filament-spool');
        named.appendChild(link(spoolName(usage.spool_id),
          assigned ? '/spools/' + usage.spool_id : null));
        text.appendChild(named);

        text.appendChild(el('div', 'filament-figures', filamentFigures(usage)));
        block.appendChild(text);

        var edit = withIcon(el('button', 'icon-button'), 'pencil');
        edit.type = 'button';
        edit.title = t('history.edit');
        edit.setAttribute('aria-label', t('history.edit'));
        edit.addEventListener('click', function () { openFilamentEditor(usage, isRunning); });
        block.appendChild(edit);

        return block;
      }

      function filamentWhat(usage) {
        var what = el('div', 'filament-what', usage.material || '-');
        what.appendChild(el('span', null,
          usage.slot_index === EXTERNAL_SLOT_INDEX
            ? t('history.external')
            : t('history.slotIs', { slot: usage.slot_index || '-' })));

        if (isSplit(usage)) {
          what.appendChild(el('span', null, t('history.span', {
            from: Math.round(share(usage.from_fraction, 0) * 100),
            to: Math.round(share(usage.to_fraction, 1) * 100)
          })));
        }
        return what;
      }

      function filamentFigures(usage) {
        var parts = [t('history.estimatedIs', { grams: grams(usage.estimated_grams) })];
        if (usage.used_so_far !== null && usage.used_so_far !== undefined) {
          parts.push(t('history.usedSoFar', { grams: grams(usage.used_so_far) }));
        }
        parts.push(usage.spent_at
          ? t('history.bookedIs', { grams: grams(usage.spent_grams) })
          : t('history.notBooked'));
        if (usage.manual_override) parts.push(t('history.corrected'));
        return parts.join(' · ');
      }

      function isSplit(usage) {
        // Both ends empty means the row covers the whole print, which is the
        // normal case and worth no words.
        return share(usage.from_fraction, null) !== null || share(usage.to_fraction, null) !== null;
      }

      function share(value, fallback) {
        return value === null || value === undefined ? fallback : value;
      }

      function openFilamentEditor(usage, isRunning) {
        // Everything that can be changed about one filament lives in this one
        // window, so the card itself stays readable. The spool question needs
        // colour, remaining weight and a way to narrow a few hundred entries,
        // and none of that fits beside a table row.
        var state = {
          material: usage.material || '',
          query: '',
          order: 'match',
          // Off while the print runs, and not offered either: what it has laid
          // down so far is not what it will have used at the end.
          bookNow: !isRunning,
          running: Boolean(isRunning)
        };

        var box = el('div', 'picker');
        box.appendChild(pickerHead(usage));

        // Nothing to correct before a spool has answered for the filament, and
        // nothing to correct towards while the print is still adding to it.
        if (!state.running && usage.spool_id !== null && usage.spool_id !== undefined) {
          box.appendChild(amountSection(usage));
        }
        box.appendChild(spoolSection(usage, state));

        openOverlay(box);
      }

      function amountSection(usage) {
        var section = el('div', 'picker-section');
        section.appendChild(el('div', 'picker-label', t('editor.amount')));

        var actions = el('div', 'row-actions');
        var amount = el('input');
        amount.type = 'number';
        amount.min = '0';
        amount.step = '0.1';
        var current = usage.spent_grams === null || usage.spent_grams === undefined
          ? usage.estimated_grams : usage.spent_grams;
        amount.value = current === null || current === undefined ? '' : current.toFixed(1);
        actions.appendChild(amount);

        var button = el('button', 'button ghost', t('history.correct'));
        button.type = 'button';
        button.addEventListener('click', function () {
          if (amount.value === '') return;
          closeOverlay();
          act(button, write(ADMIN + '/filament/' + usage.id + '/correct', {
            grams: Number(amount.value)
          }));
        });
        actions.appendChild(button);

        section.appendChild(actions);
        return section;
      }

      function spoolSection(usage, state) {
        var section = el('div', 'picker-section');
        var list = el('div', 'picker-list');

        section.appendChild(el('div', 'picker-label', t('picker.heading')));
        section.appendChild(pickerChips(state, function () { fill(); }));
        section.appendChild(pickerTools(usage, state, function () { fill(); }));
        section.appendChild(list);

        function fill() {
          list.textContent = '';
          var entries = pickerEntries(usage, state);

          if (!entries.length) {
            list.appendChild(el('p', 'picker-detail', t('picker.none')));
            return;
          }
          entries.forEach(function (entry) {
            list.appendChild(pickerRow(usage, entry, state));
          });
        }

        fill();
        return section;
      }

      function pickerHead(usage) {
        var head = el('div', 'picker-head');
        head.appendChild(el('div', 'picker-title', t('editor.heading')));
        head.appendChild(el('div', 'picker-wanted', t('picker.wanted', {
          material: usage.material || '-',
          slot: usage.slot_index || '-'
        })));
        return head;
      }

      function pickerChips(state, changed) {
        var chips = el('div', 'chips');
        var materials = [];

        spools.forEach(function (spool) {
          if (spool.material && materials.indexOf(spool.material) < 0) materials.push(spool.material);
        });
        materials.sort();

        [''].concat(materials).forEach(function (material) {
          var chip = el('button', 'chip', material || t('picker.all'));
          chip.type = 'button';
          if (sameMaterial(material, state.material) || (!material && !state.material)) {
            chip.classList.add('on');
          }
          chip.addEventListener('click', function () {
            state.material = material;
            chips.querySelectorAll('.chip').forEach(function (other) {
              other.classList.remove('on');
            });
            chip.classList.add('on');
            changed();
          });
          chips.appendChild(chip);
        });

        return chips;
      }

      function pickerTools(usage, state, changed) {
        var tools = el('div', 'picker-tools');

        var search = el('input');
        search.type = 'text';
        search.placeholder = t('picker.search');
        search.addEventListener('input', function () {
          state.query = search.value;
          changed();
        });
        tools.appendChild(search);

        var order = el('select');
        [['match', 'picker.sortMatch'], ['remaining', 'picker.sortRemaining'], ['used', 'picker.sortUsed']]
          .forEach(function (pair) {
            var option = el('option', null, t(pair[1]));
            option.value = pair[0];
            order.appendChild(option);
          });
        order.addEventListener('change', function () {
          state.order = order.value;
          changed();
        });
        tools.appendChild(order);

        // Only a question while nothing is booked yet and the print has ended.
        // Moving an existing booking happens either way, so offering the choice
        // would lie, and a running print is never booked by hand.
        if (!usage.spent_at && !state.running) {
          var bookLabel = el('label', 'check');
          var bookNow = el('input');
          bookNow.type = 'checkbox';
          bookNow.checked = state.bookNow;
          bookNow.addEventListener('change', function () { state.bookNow = bookNow.checked; });
          bookLabel.appendChild(bookNow);
          bookLabel.appendChild(el('span', null, t('history.bookNow')));
          tools.appendChild(bookLabel);
        }

        return tools;
      }

      function pickerEntries(usage, state) {
        var wanted = normalizeColor(usage.color_hex);
        var query = state.query.trim().toLowerCase();
        var entries = [];

        spools.forEach(function (spool, spoolId) {
          if (state.material && !sameMaterial(spool.material, state.material)) return;
          if (query && spool.label.toLowerCase().indexOf(query) < 0) return;
          entries.push({
            id: spoolId,
            spool: spool,
            matches: Boolean(wanted) && spool.color === wanted
          });
        });

        return entries.sort(function (a, b) {
          if (state.order === 'used') return usedAt(b.spool) - usedAt(a.spool);
          if (state.order === 'remaining') return (b.spool.remaining || 0) - (a.spool.remaining || 0);
          // The colour the slicer asked for comes first, and an empty spool is
          // rarely the answer, so it sinks without disappearing.
          if (a.matches !== b.matches) return a.matches ? -1 : 1;
          return (b.spool.remaining || 0) - (a.spool.remaining || 0);
        });
      }

      function usedAt(spool) {
        return spool.lastUsed ? new Date(spool.lastUsed).getTime() : 0;
      }

      function pickerRow(usage, entry, state) {
        var row = el('div', 'picker-row');

        var swatch = el('div', 'picker-color');
        if (entry.spool.color) swatch.style.background = '#' + entry.spool.color;
        row.appendChild(swatch);

        var text = el('div', 'picker-text');
        text.appendChild(el('div', 'picker-name',
          '#' + entry.id + '  ' + entry.spool.material + (entry.spool.maker ? ' · ' + entry.spool.maker : '')));
        text.appendChild(el('div', 'picker-detail',
          entry.spool.designation + ' · ' + grams(entry.spool.remaining)));
        // Which one the row sits on now, so nobody hunts for it in the list.
        if (entry.id === usage.spool_id) {
          text.appendChild(el('span', 'badge', t('picker.current')));
        }
        row.appendChild(text);

        var button = el('button', 'button', t('picker.assign'));
        button.type = 'button';
        button.addEventListener('click', function () {
          closeOverlay();
          act(button, write(ADMIN + '/filament/' + usage.id + '/assign', {
            spool_id: entry.id,
            spend_now: state.bookNow
          }));
        });
        row.appendChild(button);

        return row;
      }

      function openOverlay(content) {
        var box = document.getElementById('overlay-box');
        box.textContent = '';
        // Added here rather than to the markup, so every window that will ever
        // open has it and closeOverlay may keep emptying the box.
        box.appendChild(closeButton());
        box.appendChild(content);
        document.getElementById('overlay').hidden = false;
      }

      function closeButton() {
        var button = withIcon(el('button', 'icon-button overlay-close'), 'close');
        button.type = 'button';
        button.title = t('page.close');
        button.setAttribute('aria-label', t('page.close'));
        button.addEventListener('click', closeOverlay);
        return button;
      }

      function closeOverlay() {
        document.getElementById('overlay').hidden = true;
        document.getElementById('overlay-box').textContent = '';
      }

      function act(button, promise) {
        clearComplaint();
        button.disabled = true;
        promise.then(function () {
          // The spools first and the history after, never both at once:
          // loadSpools empties the map before it refills it, and a history
          // rendered in that moment shows bare ids where the names belong.
          return loadSpools().then(function () { return loadHistory(true); });
        }).catch(complain).then(function () {
          button.disabled = false;
        });
      }

      /* ── settings ────────────────────────────────────────────── */

      function loadSettings() {
        return read(MOUNT + '/settings').then(function (rows) {
          settingsRows.clear();
          rows.forEach(function (row) {
            settingsRows.set(row.printer_id, row);
          });
          buildScope();
          fillSettings();
        });
      }

      function buildScope() {
        var scope = document.getElementById('settings-scope');
        var chosen = scope.value;
        scope.textContent = '';

        var everywhere = el('option', null, t('settings.global'));
        everywhere.value = String(GLOBAL_PRINTER_ID);
        scope.appendChild(everywhere);

        printers.forEach(function (printer) {
          var option = el('option', null, printer.printer_name);
          option.value = String(printer.printer_id);
          scope.appendChild(option);
        });

        if (chosen) scope.value = chosen;
      }

      function fillSettings() {
        var printerId = Number(document.getElementById('settings-scope').value || GLOBAL_PRINTER_ID);
        // A printer without a row of its own inherits the global one, which is
        // exactly what the backend does when it resolves the settings.
        var row = settingsRows.get(printerId) || settingsRows.get(GLOBAL_PRINTER_ID) || {};

        document.getElementById('tracking-enabled').checked = row.tracking_enabled !== false;
        document.getElementById('auto-spend').checked = row.auto_spend !== false;
        document.getElementById('spend-on-cancel').checked = row.spend_on_cancel !== false;
        document.getElementById('retention').value =
          row.history_retention_days === undefined ? '' : row.history_retention_days;
      }

      function saveSettings(event) {
        event.preventDefault();
        clearComplaint();

        var body = {
          printer_id: Number(document.getElementById('settings-scope').value || GLOBAL_PRINTER_ID),
          tracking_enabled: document.getElementById('tracking-enabled').checked,
          auto_spend: document.getElementById('auto-spend').checked,
          spend_on_cancel: document.getElementById('spend-on-cancel').checked,
          history_retention_days: Number(document.getElementById('retention').value || 0)
        };

        put(ADMIN + '/settings', body).then(function () {
          var saved = document.getElementById('settings-saved');
          saved.hidden = false;
          setTimeout(function () { saved.hidden = true; }, SAVED_VISIBLE_MS);
          return loadSettings();
        }).catch(complain);
      }

      /* ── boot ────────────────────────────────────────────────── */

      document.getElementById('overlay').addEventListener('click', function (event) {
        // Only the backdrop closes. A click inside the box belongs to the box.
        if (event.target === this) closeOverlay();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeOverlay();
      });

      document.getElementById('load-more').addEventListener('click', function () {
        loadHistory(false).catch(complain);
      });

      var search = document.getElementById('history-search');
      withIcon(search.parentNode, 'search');
      search.addEventListener('input', function () {
        // One request per pause, not per keystroke.
        window.clearTimeout(searchTimer);
        searchTimer = window.setTimeout(function () {
          historyFilter.search = search.value.trim();
          loadHistory(true).catch(complain);
        }, SEARCH_DELAY_MS);
      });

      document.getElementById('history-hide-failed').addEventListener('change', function () {
        historyFilter.hideFailed = this.checked;
        loadHistory(true).catch(complain);
      });

      document.getElementById('history-order').addEventListener('change', function () {
        historyFilter.order = this.value;
        loadHistory(true).catch(complain);
      });
      document.getElementById('settings-form').addEventListener('submit', saveSettings);
      document.getElementById('settings-scope').addEventListener('change', fillSettings);

      loadDictionary()
        .then(refreshStatus)
        .then(loadSpools)
        .then(loadSettings)
        .then(function () { return loadHistory(true); })
        .then(function () { booted = true; })
        .catch(complain);

      setInterval(function () {
        refreshStatus().catch(function () { /* the next round tries again */ });
      }, STATUS_INTERVAL_MS);
    })();
  </script>
</body>
</html>
